<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b12">
  <title>GitHub 热榜 · 每日 Trending</title>
  <meta name="description" content="每天自动抓取 GitHub Trending，按总榜与编程语言展示最热门的开源项目。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="24" height="24">
            <path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>GitHub 热榜</h1>
          <p class="tagline">每天自动抓取 GitHub Trending，发现正在走红的开源项目</p>
        </div>
      </div>
      <div class="update-badge" id="updateBadge">
        <span class="badge-dot"></span>
        <span id="updateText">正在加载数据…</span>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>

    <nav class="tabs" id="tabs" aria-label="榜单分类"></nav>

    <section class="board" aria-labelledby="boardTitle">
      <div class="board-head">
        <h2 class="board-title" id="boardTitle">今日热门总榜</h2>
        <p class="board-sub" id="boardSub">正在加载榜单数据…</p>
      </div>

      <div class="list" id="list" aria-live="polite">
        <div class="repo skeleton" aria-hidden="true">
          <span class="rank"></span>
          <div class="repo-body">
            <div class="sk-line sk-title"></div>
            <div class="sk-line sk-desc"></div>
            <div class="sk-line sk-meta"></div>
          </div>
        </div>
        <div class="repo skeleton" aria-hidden="true">
          <span class="rank"></span>
          <div class="repo-body">
            <div class="sk-line sk-title"></div>
            <div class="sk-line sk-desc"></div>
            <div class="sk-line sk-meta"></div>
          </div>
        </div>
        <div class="repo skeleton" aria-hidden="true">
          <span class="rank"></span>
          <div class="repo-body">
            <div class="sk-line sk-title"></div>
            <div class="sk-line sk-desc"></div>
            <div class="sk-line sk-meta"></div>
          </div>
        </div>
        <div class="repo skeleton" aria-hidden="true">
          <span class="rank"></span>
          <div class="repo-body">
            <div class="sk-line sk-title"></div>
            <div class="sk-line sk-desc"></div>
            <div class="sk-line sk-meta"></div>
          </div>
        </div>
        <div class="repo skeleton" aria-hidden="true">
          <span class="rank"></span>
          <div class="repo-body">
            <div class="sk-line sk-title"></div>
            <div class="sk-line sk-desc"></div>
            <div class="sk-line sk-meta"></div>
          </div>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <span>数据来源：<a href="https://github.com/trending" target="_blank" rel="noopener noreferrer">github.com/trending</a></span>
      <span>由 GitHub Actions 每天 08:00（北京时间）自动更新</span>
    </footer>
  </div>

  <script src="data/trending.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
